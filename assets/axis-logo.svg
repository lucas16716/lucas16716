<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#1c1b2e"/>
      <stop offset="100%" stop-color="#0a0910"/>
    </radialGradient>

    <radialGradient id="ring-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background — deep ink -->
  <rect width="400" height="460" fill="url(#bg-glow)"/>

  <!-- Subtle noise vignette -->
  <rect width="400" height="460" fill="url(#ring-glow)"/>

  <!-- Outer orbit ring -->
  <circle cx="200" cy="200" r="152" fill="none" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.08"/>

  <!-- Mid ring -->
  <circle cx="200" cy="200" r="110" fill="none" stroke="#ffffff" stroke-width="0.4" stroke-opacity="0.06"/>

  <!-- Cardinal tick marks on outer ring -->
  <g stroke="#ffffff" stroke-opacity="0.2" stroke-width="0.8">
    <line x1="200" y1="44" x2="200" y2="54"/>
    <line x1="200" y1="346" x2="200" y2="356"/>
    <line x1="44" y1="200" x2="54" y2="200"/>
    <line x1="346" y1="200" x2="356" y2="200"/>
    <!-- 45deg ticks -->
    <line x1="93" y1="93" x2="100" y2="100"/>
    <line x1="300" y1="93" x2="307" y2="100"/>
    <line x1="93" y1="307" x2="100" y2="300"/>
    <line x1="300" y1="307" x2="307" y2="300"/>
  </g>

  <!-- X MARK — two diagonals, extending edge to edge -->
  <!-- Left diagonal (top-right to bottom-left) — main stroke -->
  <line x1="96" y1="86" x2="304" y2="314"
    stroke="#e8e4de"
    stroke-width="1.8"
    stroke-linecap="round"
    filter="url(#soft-glow)"/>

  <!-- Right diagonal (top-left to bottom-right) -->
  <line x1="304" y1="86" x2="96" y2="314"
    stroke="#e8e4de"
    stroke-width="1.8"
    stroke-linecap="round"
    filter="url(#soft-glow)"/>

  <!-- Quadrant labels — ultra faint, architectural -->
  <text x="200" y="136" text-anchor="middle"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="7" fill="#ffffff" fill-opacity="0.12" letter-spacing="3">I</text>
  <text x="264" y="204" text-anchor="middle"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="7" fill="#ffffff" fill-opacity="0.12" letter-spacing="3">II</text>
  <text x="200" y="270" text-anchor="middle"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="7" fill="#ffffff" fill-opacity="0.12" letter-spacing="3">III</text>
  <text x="136" y="204" text-anchor="middle"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="7" fill="#ffffff" fill-opacity="0.12" letter-spacing="3">IV</text>

  <!-- Center ring — marks the intersection, the axis point -->
  <circle cx="200" cy="200" r="18"
    fill="none"
    stroke="#e8e4de"
    stroke-width="1.2"
    filter="url(#soft-glow)"/>

  <!-- Center fill — very subtle -->
  <circle cx="200" cy="200" r="18" fill="#1c1b2e"/>

  <!-- Re-draw X inside circle so it goes through cleanly -->
  <line x1="190" y1="190" x2="210" y2="210" stroke="#e8e4de" stroke-width="1.8"/>
  <line x1="210" y1="190" x2="190" y2="210" stroke="#e8e4de" stroke-width="1.8"/>

  <!-- Origin dot — tiny, crisp -->
  <circle cx="200" cy="200" r="2.5" fill="#e8e4de"/>

  <!-- Diagonal endpoint dots — corners of the X -->
  <circle cx="96" cy="86" r="2" fill="#e8e4de" fill-opacity="0.4"/>
  <circle cx="304" cy="86" r="2" fill="#e8e4de" fill-opacity="0.4"/>
  <circle cx="96" cy="314" r="2" fill="#e8e4de" fill-opacity="0.4"/>
  <circle cx="304" cy="314" r="2" fill="#e8e4de" fill-opacity="0.4"/>

  <!-- AXIS wordmark -->
  <text
    x="200"
    y="382"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="22"
    font-weight="200"
    fill="#e8e4de"
    text-anchor="middle"
    letter-spacing="12">AXIS</text>

  <!-- Tagline -->
  <text
    x="200"
    y="402"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="7.5"
    fill="#ffffff"
    fill-opacity="0.28"
    text-anchor="middle"
    letter-spacing="4">STARTER FOUNDATION</text>

</svg>
